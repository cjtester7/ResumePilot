<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResumePilot — Job Application Studio</title>
<style>
:root{--blue:#1769ff;--blue2:#eaf2ff;--ink:#172033;--muted:#667085;--line:#dfe6f0;--bg:#f5f7fb;--card:#fff;--green:#179b62;--amber:#a86408;--shadow:0 8px 24px rgba(26,49,89,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 12px;color:var(--ink);font-weight:600}button:hover{border-color:#a9c4ff;background:#f8fbff}button.primary{background:var(--blue);border-color:var(--blue);color:#fff}button.primary:hover{background:#0958e8}button.soft{background:var(--blue2);border-color:#d5e4ff;color:var(--blue)}button.danger{color:#b42318}button.small{padding:6px 9px;font-size:12px}input,textarea,select{width:100%;border:1px solid #d7deea;border-radius:8px;padding:10px 11px;background:#fff;color:var(--ink);outline:none}input:focus,textarea:focus,select:focus{border-color:#7ba7ff;box-shadow:0 0 0 3px #1769ff14}textarea{resize:vertical;min-height:110px;line-height:1.55}.app{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px}.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;border-bottom:1px solid var(--line)}.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#1769ff,#4d91ff);display:grid;place-items:center;color:#fff;font-size:20px;font-weight:800}.brand strong{font-size:19px;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:11px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:11px 12px;font-weight:550}.nav button.active{background:var(--blue2);color:var(--blue)}.nav .ico{width:20px;text-align:center;font-size:16px}.sidefoot{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--muted);font-size:12px}.sidefoot strong{color:var(--ink)}.main{min-width:0}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;gap:15px}.topbar h1{font-size:18px;margin:0}.topbar p{margin:2px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;align-items:center}.content{padding:22px 26px 40px;max-width:1600px;margin:auto}.workflow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}.step-pill{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;gap:10px;align-items:flex-start;min-width:0}.step-pill .num{width:29px;height:29px;flex:0 0 29px;border-radius:50%;background:#e8edf5;color:#52617a;display:grid;place-items:center;font-weight:800}.step-pill.current{border-color:#a8c6ff;box-shadow:0 0 0 2px #1769ff0d}.step-pill.current .num,.step-pill.done .num{background:var(--blue);color:#fff}.step-pill strong{display:block;font-size:12px;line-height:1.3}.step-pill small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.pagehead h2{font-size:23px;letter-spacing:-.6px;margin:0 0 4px}.pagehead p{color:var(--muted);margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:var(--shadow);min-width:0}.cardhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:13px}.cardhead h3{margin:0;font-size:15px}.cardhead p{margin:4px 0 0;color:var(--muted);font-size:12px}.kicker{color:var(--blue);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-weight:650;font-size:12px;color:#3c4960}.field small{color:var(--muted);font-size:11px}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.muted{color:var(--muted)}.status{display:inline-flex;align-items:center;gap:6px;background:#e9f8f0;color:#137548;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:750}.status:before{content:"";width:6px;height:6px;background:currentColor;border-radius:50%}.status.draft{background:#f2f4f7;color:#667085}.status.review{background:#fff4dd;color:#9a5b00}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:15px;overflow:auto}.tabs button{border:0;border-radius:8px 8px 0 0;background:transparent;white-space:nowrap;color:var(--muted)}.tabs button.active{color:var(--blue);background:#f2f6ff;border-bottom:2px solid var(--blue)}.editor{min-height:360px;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}.dochead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}.dochead strong{font-size:14px}.versions{display:flex;gap:7px;align-items:center}.versions select{width:auto;max-width:210px;padding:7px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:17px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:24px;margin-top:3px}.list{display:grid;gap:9px}.listitem{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px}.listitem h4{margin:0 0 3px;font-size:13px}.listitem p{margin:0;color:var(--muted);font-size:11px}.listitem .actions{justify-content:flex-end}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed #cbd5e1;border-radius:10px}.checklist{display:grid;gap:9px}.checkrow{display:flex;gap:9px;align-items:flex-start}.checkrow input{width:auto;margin-top:3px}.checkrow label{font-size:13px}.tag{display:inline-block;padding:4px 8px;background:#f0f4fa;border-radius:6px;margin:3px 3px 0 0;font-size:11px;color:#46546b}.footer-note{font-size:11px;color:var(--muted);margin-top:14px}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;border-radius:10px;padding:12px 16px;box-shadow:var(--shadow);z-index:99;max-width:340px}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:#14213d66;display:grid;place-items:center;padding:20px;z-index:100}.modal{width:min(540px,100%);background:#fff;border-radius:15px;padding:22px;box-shadow:0 20px 70px #0d1c3540}.modal h3{margin:0 0 6px}.modal p{color:var(--muted);font-size:13px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.filelabel{display:inline-flex;align-items:center;gap:6px}.filelabel input{display:none}.progressline{height:5px;background:#edf1f7;border-radius:9px;overflow:hidden;margin-top:8px}.progressline span{display:block;height:100%;background:var(--blue);width:0}.notice{background:#fff8e8;border:1px solid #f4dca6;color:#82560b;border-radius:10px;padding:11px 13px;font-size:12px;margin-bottom:15px}
@media(max-width:1050px){.app{grid-template-columns:190px minmax(0,1fr)}.content{padding:18px}.workflow{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.app{display:block}.sidebar{padding:10px;border-right:0;border-bottom:1px solid var(--line)}.brand{border:0;padding:4px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.nav button .ico{display:none}.sidefoot{display:none}.topbar{height:auto;padding:14px;align-items:flex-start}.content{padding:13px}.workflow{grid-template-columns:1fr 1fr}.step-pill{padding:9px}.grid3,.stats{grid-template-columns:1fr}.pagehead{align-items:flex-start;flex-direction:column}.row{flex-direction:column;gap:0}.editor{min-height:280px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">R</div><div><strong>ResumePilot</strong><small>Job Application Studio</small></div></div>
  <nav class="nav" id="nav">
    <button class="active" data-view="dashboard"><span class="ico">⌂</span>Dashboard</button>
    <button data-view="application"><span class="ico">＋</span>New Application</button>
    <button data-view="applications"><span class="ico">▣</span>My Applications</button>
    <button data-view="resumes"><span class="ico">▤</span>Resume Library</button>
    <button data-view="letters"><span class="ico">✉</span>Cover Letter Library</button>
    <button data-view="jobs"><span class="ico">☷</span>Job Descriptions</button>
    <button data-view="backup"><span class="ico">⚙</span>Backup & Settings</button>
  </nav>
  <div class="sidefoot"><strong>Private workspace</strong><br>Data is saved in this browser on this device. Export backups regularly.</div>
</aside>
<main class="main">
  <header class="topbar"><div><h1 id="topTitle">Dashboard</h1><p>Target · Tailor · Apply · Succeed</p></div><div class="top-actions"><button id="quickNew" class="primary">＋ New application</button><button id="helpBtn">Help</button></div></header>
  <div class="content" id="content"></div>
</main>
</div>
<div id="modalroot"></div><div id="toastroot"></div>
<script>
(function(){
'use strict';
const KEY='resumepilot_local_v1';
const steps=[
 ['Analyze Job','Extract key requirements'],
 ['Evaluate Fit','Map your evidence'],
 ['Tailor Resume','Create a targeted resume'],
 ['Write Cover Letter','Generate and refine'],
 ['Prepare & Export','Review and save']
];
const starterResume=`YOUR NAME
City, State | Phone | Email | LinkedIn

PROFESSIONAL SUMMARY
Write a concise summary tailored to the target role.

CORE SKILLS
Add relevant, verified skills and tools.

PROFESSIONAL EXPERIENCE
Job Title | Company | Dates
• Achievement or responsibility relevant to this job.
• Add measurable results where you can verify them.

EDUCATION & CERTIFICATIONS
Add relevant education and credentials.`;
const starterLetter=`[Date]

Hiring Manager
[Company Name]

Dear Hiring Manager,

I am writing to apply for the [Job Title] position. My experience in [relevant area] has helped me develop strengths in [two or three relevant skills].

In my previous work, I [specific, truthful example connected to the job requirements]. I would welcome the opportunity to bring this experience to [Company Name] and contribute to [relevant team goal].

Thank you for your consideration. I look forward to the opportunity to discuss how my background aligns with your needs.

Sincerely,
[Your Name]`;
let db=loadDB(), view='dashboard', activeId=null, currentStep=1, activeTab='overview', resumeMode='editor', letterMode='editor';
function uid(){return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function stamp(){return new Date().toISOString()}
function prettyDate(s){if(!s)return '—';try{return new Date(s).toLocaleString([], {year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch(e){return s}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadDB(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');return {applications:Array.isArray(x.applications)?x.applications:[],resumes:Array.isArray(x.resumes)?x.resumes:[],letters:Array.isArray(x.letters)?x.letters:[],jobs:Array.isArray(x.jobs)?x.jobs:[],settings:x.settings||{}}}catch(e){return {applications:[],resumes:[],letters:[],jobs:[],settings:{}}}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Could not save. Your browser storage may be full; export a backup and remove large content.');return false}}
function toast(msg){const root=document.getElementById('toastroot');root.innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(()=>{root.innerHTML=''},3000)}
function activeApp(){return db.applications.find(a=>a.id===activeId)||null}
function makeVersion(content,label){return {id:uid(),label:label||'Version',content,createdAt:stamp()}}
function createApp(data={}){const a={id:uid(),title:data.title||'Untitled application',company:data.company||'',location:data.location||'',url:data.url||'',status:'In progress',createdAt:stamp(),updatedAt:stamp(),jobText:data.jobText||'',analysis:data.analysis||'',fit:data.fit||'',notes:'',checks:[],resumeVersions:[makeVersion(data.resume||starterResume,'v1.0 — Initial')],letterVersions:[makeVersion(data.letter||starterLetter,'v1.0 — Initial')],activeResumeVersion:null,activeLetterVersion:null};a.activeResumeVersion=a.resumeVersions[0].id;a.activeLetterVersion=a.letterVersions[0].id;db.applications.unshift(a);activeId=a.id;persist();return a}
function currentVersion(a,type){const list=type==='resume'?a.resumeVersions:a.letterVersions;const id=type==='resume'?a.activeResumeVersion:a.activeLetterVersion;return list.find(v=>v.id===id)||list[list.length-1]}
function versionList(a,type){return type==='resume'?a.resumeVersions:a.letterVersions}
function setCurrentVersion(a,type,id){if(type==='resume')a.activeResumeVersion=id;else a.activeLetterVersion=id;a.updatedAt=stamp();persist()}
function saveNewVersion(a,type,content,label){const list=versionList(a,type);const vnum=list.length+1;const v=makeVersion(content,label||`v1.${vnum-1} — Saved ${new Date().toLocaleDateString()}`);list.push(v);if(type==='resume')a.activeResumeVersion=v.id;else a.activeLetterVersion=v.id;a.updatedAt=stamp();persist();toast('New version saved. Previous versions remain available.');render()}
function setView(v){view=v;if(v!=='application')activeId=null;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
function stepHeader(){return `<div class="workflow">${steps.map((s,i)=>`<div class="step-pill ${i+1===currentStep?'current':''} ${i+1<currentStep?'done':''}" data-step="${i+1}" role="button" tabindex="0"><div class="num">${i+1<currentStep?'✓':i+1}</div><div><strong>${s[0]}</strong><small>${s[1]}</small></div></div>`).join('')}</div>`}
function pageHead(title,sub,buttons=''){return `<div class="pagehead"><div><h2>${esc(title)}</h2><p>${esc(sub||'')}</p></div><div class="actions">${buttons}</div></div>`}
function cardHead(title,sub,extra=''){return `<div class="cardhead"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div>${extra}</div>`}
function appCard(a){return `<div class="listitem"><div><h4>${esc(a.title||'Untitled application')} ${a.company?'— '+esc(a.company):''}</h4><p>Updated ${prettyDate(a.updatedAt)} · ${a.resumeVersions.length} resume version(s) · ${a.letterVersions.length} cover letter version(s)</p></div><div class="actions"><span class="status ${a.status==='Complete'?'':'review'}">${esc(a.status)}</span><button class="small primary" data-open="${a.id}">Open</button></div></div>`}
function render(){document.getElementById('topTitle').textContent=({dashboard:'Dashboard',application:activeApp()?.title||'Application workspace',applications:'My Applications',resumes:'Resume Library',letters:'Cover Letter Library',jobs:'Job Descriptions',backup:'Backup & Settings'})[view]||'ResumePilot';const c=document.getElementById('content');if(view==='dashboard')c.innerHTML=renderDashboard();else if(view==='application')c.innerHTML=renderApplication();else if(view==='applications')c.innerHTML=renderApplications();else if(view==='resumes')c.innerHTML=renderLibrary('resume');else if(view==='letters')c.innerHTML=renderLibrary('letter');else if(view==='jobs')c.innerHTML=renderJobs();else if(view==='backup')c.innerHTML=renderBackup();else c.innerHTML=renderDashboard();bindContent()}
function renderDashboard(){const apps=db.applications;return pageHead('Your job search workspace','One organized place to analyze roles, tailor documents, and track each application.','<button class="primary" data-action="newapp">＋ Start an application</button>')+`<div class="stats"><div class="stat"><span>Applications</span><strong>${apps.length}</strong></div><div class="stat"><span>Resume versions</span><strong>${db.resumes.length+apps.reduce((n,a)=>n+a.resumeVersions.length,0)}</strong></div><div class="stat"><span>Cover letter versions</span><strong>${db.letters.length+apps.reduce((n,a)=>n+a.letterVersions.length,0)}</strong></div></div><div class="notice"><strong>Prototype note:</strong> This single-file app saves data in this browser only. It does not send your information to a server. Export a JSON backup before clearing browser data or switching devices.</div><div class="grid2"><section class="card">${cardHead('Recent applications','Pick up where you left off.','<button class="small" data-goto="applications">View all</button>')}<div class="list">${apps.length?apps.slice(0,5).map(appCard).join(''):'<div class="empty">No applications yet. Start one to begin the five-step workflow.</div>'}</div></section><section class="card">${cardHead('Five-step process','A repeatable workflow for every job.')}${steps.map((s,i)=>`<div class="checkrow" style="margin:12px 0"><span class="tag">${i+1}</span><div><strong>${s[0]}</strong><div class="muted">${s[1]}</div></div></div>`).join('')}<p class="footer-note">Use the job description and your verified experience as the source of truth. Review every AI-generated or manually drafted claim before applying.</p></section></div>`}
function renderApplications(){return pageHead('My Applications','Each application keeps its own job description, analysis, notes, and document versions.','<button class="primary" data-action="newapp">＋ New application</button>')+`<section class="card"><div class="list">${db.applications.length?db.applications.map(appCard).join(''):'<div class="empty">Your application list is empty.</div>'}</div></section>`}
function renderApplication(){const a=activeApp();if(!a)return pageHead('New application','Create a workspace for one specific job.','')+renderNewApplication();const rv=currentVersion(a,'resume'),lv=currentVersion(a,'letter');return stepHeader()+`<div class="pagehead"><div><div class="kicker">APPLICATION WORKSPACE</div><h2>${esc(a.title)}</h2><p>${esc(a.company||'Company not entered')} · ${esc(a.location||'Location not entered')} · <span class="status ${a.status==='Complete'?'':'review'}">${esc(a.status)}</span></p></div><div class="actions"><button data-action="rename">Edit details</button><button data-action="deleteapp" class="danger">Delete</button></div></div><div class="tabs">${[['overview','Overview'],['job','Job description'],['analysis','Analysis & fit'],['resume','Tailored resume'],['letter','Cover letter'],['versions','Versions & notes']].map(t=>`<button class="${activeTab===t[0]?'active':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>${activeTab==='overview'?renderOverview(a,rv,lv):activeTab==='job'?renderJobTab(a):activeTab==='analysis'?renderAnalysisTab(a):activeTab==='resume'?renderDocTab(a,'resume',rv):activeTab==='letter'?renderDocTab(a,'letter',lv):renderVersionsTab(a)}`}
function renderNewApplication(){return `<section class="card" style="max-width:800px">${cardHead('Create a job application','Enter the details you know now. You can fill in the rest later.')}<form id="newappform"><div class="field"><label>Job title *</label><input name="title" required placeholder="e.g., Broadcast IT Engineer I"></div><div class="row"><div class="field"><label>Company</label><input name="company" placeholder="Company name"></div><div class="field"><label>Location / work style</label><input name="location" placeholder="Remote, hybrid, city…"></div></div><div class="field"><label>Job posting URL (optional)</label><input name="url" type="url" placeholder="https://…"></div><div class="field"><label>Paste job description (optional)</label><textarea name="jobText" placeholder="Paste the full job description here…"></textarea></div><div class="actions"><button class="primary" type="submit">Create application and continue →</button><button type="button" data-goto="dashboard">Cancel</button></div></form></section>`}
function renderOverview(a,rv,lv){return `<div class="grid2"><section class="card">${cardHead('Step 1 · Analyze the job','Paste or edit the job posting to identify what matters.')}<div class="field"><label>Job description</label><textarea id="overviewJob" placeholder="Paste the job description…">${esc(a.jobText)}</textarea></div><div class="actions"><button class="primary" data-action="analyze">Save & analyze</button><button data-tab="job">Open full editor</button></div>${a.analysis?`<p class="footer-note">Analysis saved. Open Analysis & fit to review and edit it.</p>`:''}</section><section class="card">${cardHead('Step 2 · Evaluate your fit','Map requirements to evidence from your actual background.')}<div class="field"><label>Fit analysis / evidence map</label><textarea id="overviewFit" placeholder="For each requirement, record your evidence, strength of match, and any gap…">${esc(a.fit)}</textarea></div><button class="primary" data-action="savefit">Save fit analysis</button><p class="footer-note">Avoid claiming a skill or achievement unless you can support it with real experience.</p></section><section class="card">${cardHead('Step 3 · Tailored resume',`Current: ${esc(rv.label)}`)}<p class="muted">Edit your targeted resume, save a named version, and restore an earlier version at any time.</p><button class="primary" data-tab="resume">Open resume editor →</button></section><section class="card">${cardHead('Step 4 · Cover letter',`Current: ${esc(lv.label)}`)}<p class="muted">Create a letter that connects your most relevant experience to this employer's needs.</p><button class="primary" data-tab="letter">Open cover letter editor →</button></section><section class="card" style="grid-column:1/-1">${cardHead('Step 5 · Prepare & export','Review your documents, record next steps, and download your files.')}<div class="row"><div><strong>Resume</strong><p class="muted">${esc(rv.label)} · ${rv.content.length.toLocaleString()} characters</p></div><div><strong>Cover letter</strong><p class="muted">${esc(lv.label)} · ${lv.content.length.toLocaleString()} characters</p></div></div><div class="actions" style="margin-top:12px"><button data-action="exportpackage" class="primary">Export application package</button><button data-tab="versions">Review versions & notes</button><button data-action="complete">Mark as complete</button></div></section></div>`}
function renderJobTab(a){return `<section class="card">${cardHead('Job description','Keep the complete posting here for future tailoring.')}<div class="field"><label>Job posting URL</label><input id="jobUrl" value="${esc(a.url)}" placeholder="https://…"></div><div class="field"><label>Job description</label><textarea id="jobText" style="min-height:380px" placeholder="Paste the full job description…">${esc(a.jobText)}</textarea></div><div class="actions"><button class="primary" data-action="savejob">Save job description</button><label class="filelabel"><input id="jobFile" type="file" accept=".txt,.md,.html,.csv"> <button type="button" data-clickfile="jobFile">Import text file</button></label></div><p class="footer-note">This first version imports plain-text, Markdown, HTML, and CSV files. For PDF/DOCX, copy the text into the field for now.</p></section>`}
function renderAnalysisTab(a){return `<div class="grid2"><section class="card">${cardHead('Step 1 · Job analysis','Record the key requirements, skills, responsibilities, and keywords.')}<div class="field"><label>Analysis notes</label><textarea id="analysisText" style="min-height:360px" placeholder="Suggested structure:\n1. Must-have qualifications\n2. Core responsibilities\n3. Technical and soft skills\n4. ATS keywords\n5. Employer priorities">${esc(a.analysis)}</textarea></div><div class="actions"><button class="primary" data-action="saveanalysis">Save analysis</button><button data-action="makeanalysis">Create analysis outline</button></div></section><section class="card">${cardHead('Step 2 · Fit and gaps','Compare each requirement with evidence from your resume and work history.')}<div class="field"><label>Fit assessment</label><textarea id="fitText" style="min-height:360px" placeholder="Requirement | Evidence from your experience | Match (strong/partial/gap) | Follow-up">${esc(a.fit)}</textarea></div><div class="actions"><button class="primary" data-action="savefit2">Save fit assessment</button><button data-action="makefit">Create fit-assessment outline</button></div></section></div>`}
function renderDocTab(a,type,v){const isR=type==='resume',mode=isR?resumeMode:letterMode;const title=isR?'Tailored resume':'Cover letter';return `<section class="card">${cardHead(`Step ${isR?3:4} · ${title}`,isR?'Edit the resume for this job without changing earlier saved versions.':'Write a concise letter that complements rather than repeats the resume.',`<div class="versions"><span class="muted">Version</span><select id="${type}Version">${versionList(a,type).map(x=>`<option value="${x.id}" ${x.id===v.id?'selected':''}>${esc(x.label)}</option>`).join('')}</select></div>`)}<div class="dochead"><div class="tabs" style="margin:0;border:0"><button data-mode="${type}:editor" class="${mode==='editor'?'active':''}">Editor</button><button data-mode="${type}:preview" class="${mode==='preview'?'active':''}">Preview</button></div><div class="actions"><button class="small" data-action="savecurrent" data-type="${type}">Save changes to this version</button><button class="small primary" data-action="saveversion" data-type="${type}">＋ Save as new version</button><button class="small" data-action="downloadDoc" data-type="${type}">Download .txt</button></div></div>${mode==='editor'?`<div class="field"><label>Document content</label><textarea id="${type}Editor" class="editor">${esc(v.content)}</textarea></div>`:`<article style="white-space:pre-wrap;border:1px solid var(--line);border-radius:9px;padding:18px;min-height:360px;background:#fff">${esc(v.content)}</article>`}<div class="row"><div class="field"><label>New version name (optional)</label><input id="${type}VersionName" placeholder="e.g., v1.1 — Emphasize networking experience"></div><div class="field"><label>Import document text</label><input id="${type}File" type="file" accept=".txt,.md,.html,.csv"></div></div><p class="footer-note">Use “Save changes” to update the selected version, or “Save as new version” to preserve it and create a separate version. Version history is stored locally.</p></section>`}
function renderVersionsTab(a){return `<div class="grid2"><section class="card">${cardHead('Resume versions','Select a version to restore it in the resume editor.')}<div class="list">${a.resumeVersions.slice().reverse().map(v=>`<div class="listitem"><div><h4>${esc(v.label)} ${v.id===a.activeResumeVersion?'<span class="tag">Current</span>':''}</h4><p>${prettyDate(v.createdAt)} · ${v.content.length.toLocaleString()} characters</p></div><button class="small" data-restore="resume:${v.id}">Open version</button></div>`).join('')}</div></section><section class="card">${cardHead('Cover letter versions','Select a version to restore it in the cover letter editor.')}<div class="list">${a.letterVersions.slice().reverse().map(v=>`<div class="listitem"><div><h4>${esc(v.label)} ${v.id===a.activeLetterVersion?'<span class="tag">Current</span>':''}</h4><p>${prettyDate(v.createdAt)} · ${v.content.length.toLocaleString()} characters</p></div><button class="small" data-restore="letter:${v.id}">Open version</button></div>`).join('')}</div></section><section class="card" style="grid-column:1/-1">${cardHead('Application notes & checklist','Keep reminders and final quality checks with this application.')}<div class="field"><label>Notes / next actions</label><textarea id="appNotes" placeholder="Recruiter contact, follow-up date, interview notes, questions…">${esc(a.notes)}</textarea></div><div class="checklist">${['Resume contains only verified experience and achievements','Resume is tailored to the job requirements','Cover letter is addressed to the right company and role','Dates, contact details, spelling, and formatting checked','Required application materials are ready'].map((x,i)=>`<div class="checkrow"><input type="checkbox" id="check${i}" ${a.checks.includes(i)?'checked':''}><label for="check${i}">${x}</label></div>`).join('')}</div><div class="actions" style="margin-top:14px"><button class="primary" data-action="savenotes">Save notes & checklist</button><button data-action="exportpackage">Export application package</button></div></section></div>`}
function renderLibrary(type){const isR=type==='resume',items=isR?db.resumes:db.letters,label=isR?'Resume':'Cover letter';return pageHead(`${label} library`,`Save reusable ${isR?'master resumes and baseline versions':'letter templates'} separately from job-specific application versions.` ,`<button class="primary" data-action="newlib" data-type="${type}">＋ Add ${label.toLowerCase()}</button>`)+`<section class="card"><div class="list">${items.length?items.map(v=>`<div class="listitem"><div><h4>${esc(v.name)}</h4><p>Updated ${prettyDate(v.updatedAt)} · ${v.content.length.toLocaleString()} characters</p></div><div class="actions"><button class="small" data-action="editlib" data-type="${type}" data-id="${v.id}">Edit</button><button class="small" data-action="downloadlib" data-type="${type}" data-id="${v.id}">Download</button><button class="small danger" data-action="deletelib" data-type="${type}" data-id="${v.id}">Delete</button></div></div>`).join(''):'<div class="empty">No reusable documents saved yet. Add a master document here, or save job-specific versions inside an application.</div>'}</div></section>`}
function renderJobs(){return pageHead('Job descriptions','Keep reusable job posting text in a searchable local library.','<button class="primary" data-action="newjob">＋ Add job description</button>')+`<section class="card"><div class="list">${db.jobs.length?db.jobs.map(j=>`<div class="listitem"><div><h4>${esc(j.title)} ${j.company?'— '+esc(j.company):''}</h4><p>Saved ${prettyDate(j.updatedAt)} · ${j.content.length.toLocaleString()} characters</p></div><div class="actions"><button class="small" data-action="usejob" data-id="${j.id}">Use in application</button><button class="small" data-action="editjob" data-id="${j.id}">Edit</button><button class="small danger" data-action="deletejob" data-id="${j.id}">Delete</button></div></div>`).join(''):'<div class="empty">No job descriptions saved separately yet.</div>'}</div></section>`}
function renderBackup(){return pageHead('Backup & settings','Your data stays in this browser. Export and import backups to move between devices.','')+`<div class="grid2"><section class="card">${cardHead('Backup your workspace','Exports applications, documents, versions, notes, and job descriptions as JSON.')}<p class="muted">Create a backup before clearing browser data, changing browsers, or using another computer.</p><button class="primary" data-action="backup">Download JSON backup</button><div class="field" style="margin-top:16px"><label>Restore from backup JSON</label><input id="backupFile" type="file" accept=".json,application/json"></div><button data-action="restorebackup">Import backup (merge)</button></section><section class="card">${cardHead('Storage & privacy','Prototype storage information')}<div class="checklist"><div>Applications: <strong>${db.applications.length}</strong></div><div>Reusable resumes: <strong>${db.resumes.length}</strong></div><div>Reusable cover letters: <strong>${db.letters.length}</strong></div><div>Saved job descriptions: <strong>${db.jobs.length}</strong></div></div><p class="footer-note">Data is stored in this browser's local storage. Anyone with access to this browser profile may be able to access it. This prototype has no accounts, cloud sync, encryption, or server-side database.</p><button class="danger" data-action="clearall">Clear all local data</button></section></div>`}
function bindContent(){document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>setView(b.dataset.goto));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openApp(b.dataset.open));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;render()});document.querySelectorAll('[data-step]').forEach(b=>{b.onclick=()=>{currentStep=Number(b.dataset.step);activeTab=['overview','analysis','resume','letter','versions'][currentStep-1];render()};b.onkeydown=e=>{if(e.key==='Enter')b.click()}});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{const [type,mode]=b.dataset.mode.split(':');if(type==='resume')resumeMode=mode;else letterMode=mode;render()});document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{const [type,id]=b.dataset.restore.split(':');const a=activeApp();setCurrentVersion(a,type,id);activeTab=type; if(type==='resume')resumeMode='editor';else letterMode='editor';render();toast('Version selected. Save it as a new version if you want to branch from it.')});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset));document.querySelectorAll('[data-clickfile]').forEach(b=>b.onclick=()=>{const el=document.getElementById(b.dataset.clickfile);if(el)el.click()});const form=document.getElementById('newappform');if(form)form.onsubmit=e=>{e.preventDefault();const f=new FormData(form);const a=createApp(Object.fromEntries(f.entries()));activeTab='overview';currentStep=1;view='application';syncNav();render();toast('Application created.')};const rv=document.getElementById('resumeVersion');if(rv)rv.onchange=()=>{setCurrentVersion(activeApp(),'resume',rv.value);render()};const lv=document.getElementById('letterVersion');if(lv)lv.onchange=()=>{setCurrentVersion(activeApp(),'letter',lv.value);render()};['jobFile','resumeFile','letterFile'].forEach(id=>{const el=document.getElementById(id);if(el)el.onchange=()=>readTextFile(el,txt=>{if(id==='jobFile'){document.getElementById('jobText').value=txt}else{const target=document.getElementById(id==='resumeFile'?'resumeEditor':'letterEditor');if(target)target.value=txt}})});const bf=document.getElementById('backupFile');if(bf)bf.onchange=()=>{}}
function syncNav(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
function openApp(id){activeId=id;view='application';activeTab='overview';currentStep=1;syncNav();render()}
function action(name,data){const a=activeApp();if(name==='newapp'){activeId=null;view='application';syncNav();renderNewScreen();return}if(name==='rename'){showModal('Edit application details',`<div class="field"><label>Job title</label><input id="mTitle" value="${esc(a.title)}"></div><div class="field"><label>Company</label><input id="mCompany" value="${esc(a.company)}"></div><div class="field"><label>Location / work style</label><input id="mLocation" value="${esc(a.location)}"></div><div class="field"><label>Job URL</label><input id="mUrl" value="${esc(a.url)}">`,()=>{a.title=document.getElementById('mTitle').value.trim()||'Untitled application';a.company=document.getElementById('mCompany').value.trim();a.location=document.getElementById('mLocation').value.trim();a.url=document.getElementById('mUrl').value.trim();a.updatedAt=stamp();persist();render()});return}if(name==='deleteapp'){confirmModal('Delete this application?','This permanently removes this application and its document versions from this browser.',()=>{db.applications=db.applications.filter(x=>x.id!==a.id);activeId=null;view='applications';persist();syncNav();render()});return}if(name==='analyze'){a.jobText=document.getElementById('overviewJob').value;a.analysis=analysisOutline(a);a.updatedAt=stamp();persist();activeTab='analysis';render();toast('Job description saved and analysis outline created. Fill in the specifics.');return}if(name==='savefit'){a.fit=document.getElementById('overviewFit').value;a.updatedAt=stamp();persist();toast('Fit analysis saved.');return}if(name==='savejob'){a.url=document.getElementById('jobUrl').value;a.jobText=document.getElementById('jobText').value;a.updatedAt=stamp();persist();toast('Job description saved.');return}if(name==='saveanalysis'){a.analysis=document.getElementById('analysisText').value;a.updatedAt=stamp();persist();toast('Job analysis saved.');return}if(name==='savefit2'){a.fit=document.getElementById('fitText').value;a.updatedAt=stamp();persist();toast('Fit assessment saved.');return}if(name==='makeanalysis'){document.getElementById('analysisText').value=analysisOutline(a);return}if(name==='makefit'){document.getElementById('fitText').value=fitOutline(a);return}if(name==='savecurrent'||name==='saveversion'){const type=data.type,el=document.getElementById(type+'Editor');if(!el){toast('Switch to Editor mode to edit the document.');return}const content=el.value;if(name==='savecurrent'){const v=currentVersion(a,type);v.content=content;v.updatedAt=stamp();a.updatedAt=stamp();persist();toast('Current version updated.');render()}else{const nm=document.getElementById(type+'VersionName').value.trim();saveNewVersion(a,type,content,nm||undefined)}return}if(name==='downloadDoc'){const type=data.type,el=document.getElementById(type+'Editor');downloadText(slug(a.title)+'_'+type+'.txt',el?el.value:currentVersion(a,type).content,'text/plain');return}if(name==='exportpackage'){exportPackage(a);return}if(name==='complete'){a.status='Complete';a.updatedAt=stamp();persist();render();toast('Application marked complete.');return}if(name==='savenotes'){a.notes=document.getElementById('appNotes').value;a.checks=[0,1,2,3,4].filter(i=>document.getElementById('check'+i).checked);a.updatedAt=stamp();persist();toast('Notes and checklist saved.');return}if(name==='backup'){backup();return}if(name==='restorebackup'){restoreBackup();return}if(name==='clearall'){confirmModal('Clear all local data?','This deletes all applications and libraries from this browser. Export a backup first if you need to keep them.',()=>{localStorage.removeItem(KEY);db={applications:[],resumes:[],letters:[],jobs:[],settings:{}};activeId=null;view='dashboard';syncNav();render();toast('Local workspace cleared.')});return}if(name==='newlib'){libraryModal(data.type);return}if(name==='editlib'){const type=data.type,item=(type==='resume'?db.resumes:db.letters).find(x=>x.id===data.id);if(item)libraryModal(type,item);return}if(name==='downloadlib'){const type=data.type,item=(type==='resume'?db.resumes:db.letters).find(x=>x.id===data.id);if(item)downloadText(slug(item.name)+'.txt',item.content,'text/plain');return}if(name==='deletelib'){const arr=data.type==='resume'?db.resumes:db.letters;confirmModal('Delete this library document?','This removes the reusable document from your library.',()=>{const idx=arr.findIndex(x=>x.id===data.id);if(idx>=0)arr.splice(idx,1);persist();render()});return}if(name==='newjob'){jobModal();return}if(name==='editjob'){const j=db.jobs.find(x=>x.id===data.id);if(j)jobModal(j);return}if(name==='deletejob'){confirmModal('Delete job description?','This only deletes the saved library copy, not application records.',()=>{db.jobs=db.jobs.filter(x=>x.id!==data.id);persist();render()});return}if(name==='usejob'){const j=db.jobs.find(x=>x.id===data.id);if(j){const app=createApp({title:j.title,company:j.company,jobText:j.content,url:j.url});view='application';activeTab='overview';syncNav();render();toast('New application created from the saved job description.')}return}}
function analysisOutline(a){return `JOB ANALYSIS — ${a.title}${a.company?' at '+a.company:''}\n\n1. MUST-HAVE QUALIFICATIONS\n• Identify required experience, education, certifications, and technical skills.\n\n2. CORE RESPONSIBILITIES\n• List the main duties and expected outcomes.\n\n3. TECHNICAL & TRANSFERABLE SKILLS\n• Extract tools, platforms, domain knowledge, and interpersonal skills.\n\n4. ATS KEYWORDS / PHRASES\n• Capture exact wording from the posting where it truthfully matches your background.\n\n5. EMPLOYER PRIORITIES\n• What problems is this hire expected to solve?\n\nSOURCE JOB DESCRIPTION\n${a.jobText.slice(0,5000)}${a.jobText.length>5000?'\\n[Job description continues in the Job Description tab.]':''}`.trim()}
function fitOutline(a){return `FIT ASSESSMENT — ${a.title}\n\nFor each requirement, record evidence from the candidate's actual resume or experience. Mark the match Strong, Partial, or Gap.\n\nREQUIREMENT 1:\nEvidence:\nMatch:\nResume action:\n\nREQUIREMENT 2:\nEvidence:\nMatch:\nResume action:\n\nSTRONGEST SELLING POINTS\n• \n\nGAPS / QUESTIONS TO RESOLVE\n• \n\nPOSITIONING STRATEGY\n• Which verified experiences best demonstrate the ability to do this job?`}
function renderNewScreen(){view='application';activeId=null;syncNav();render()}
function showModal(title,body,onSave,saveLabel='Save'){document.getElementById('modalroot').innerHTML=`<div class="modalback"><div class="modal"><h3>${esc(title)}</h3>${body}<div class="modalfoot"><button data-cancel>Cancel</button><button class="primary" data-save>${esc(saveLabel)}</button></div></div></div>`;document.querySelector('[data-cancel]').onclick=closeModal;document.querySelector('[data-save]').onclick=()=>{onSave();closeModal()};document.querySelector('.modalback').onclick=e=>{if(e.target.classList.contains('modalback'))closeModal()}}
function confirmModal(title,body,yes){showModal(title,`<p>${esc(body)}</p>`,yes,'Confirm')}
function closeModal(){document.getElementById('modalroot').innerHTML=''}
function libraryModal(type,item){const isR=type==='resume';showModal((item?'Edit':'Add')+' '+(isR?'resume':'cover letter'),`<div class="field"><label>Name</label><input id="libName" value="${esc(item?.name||'')}" placeholder="${isR?'Master resume — IT support':'General cover letter'}"></div><div class="field"><label>Document text</label><textarea id="libContent" style="min-height:250px" placeholder="Paste your document here…">${esc(item?.content||(isR?starterResume:starterLetter))}</textarea></div>`,()=>{const arr=isR?db.resumes:db.letters;const obj=item||{id:uid(),createdAt:stamp()};obj.name=document.getElementById('libName').value.trim()||'Untitled';obj.content=document.getElementById('libContent').value;obj.updatedAt=stamp();if(!item)arr.unshift(obj);persist();render()})}
function jobModal(item){showModal((item?'Edit':'Add')+' job description',`<div class="field"><label>Job title</label><input id="jobLibTitle" value="${esc(item?.title||'')}"></div><div class="field"><label>Company</label><input id="jobLibCompany" value="${esc(item?.company||'')}"></div><div class="field"><label>Posting URL</label><input id="jobLibUrl" value="${esc(item?.url||'')}"></div><div class="field"><label>Job description</label><textarea id="jobLibContent" style="min-height:220px">${esc(item?.content||'')}</textarea></div>`,()=>{const j=item||{id:uid(),createdAt:stamp()};j.title=document.getElementById('jobLibTitle').value.trim()||'Untitled job';j.company=document.getElementById('jobLibCompany').value.trim();j.url=document.getElementById('jobLibUrl').value.trim();j.content=document.getElementById('jobLibContent').value;j.updatedAt=stamp();if(!item)db.jobs.unshift(j);persist();render()})}
function readTextFile(input,cb){const f=input.files&&input.files[0];if(!f)return;if(f.size>5*1024*1024){toast('File is larger than 5 MB.');input.value='';return}const r=new FileReader();r.onload=()=>{cb(String(r.result||''));toast('File text loaded. Review it and save.');input.value=''};r.onerror=()=>toast('Could not read that file.');r.readAsText(f)}
function downloadText(name,text,mime){const blob=new Blob([text],{type:mime+';charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function slug(s){return String(s||'document').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,70)||'document'}
function exportPackage(a){const r=currentVersion(a,'resume'),l=currentVersion(a,'letter');const pkg={application:{title:a.title,company:a.company,location:a.location,url:a.url,status:a.status,jobDescription:a.jobText,analysis:a.analysis,fitAssessment:a.fit,notes:a.notes,createdAt:a.createdAt,updatedAt:a.updatedAt},resume:{version:r.label,content:r.content},coverLetter:{version:l.label,content:l.content},allResumeVersions:a.resumeVersions,allCoverLetterVersions:a.letterVersions};downloadText(slug(a.title)+'_application_package.json',JSON.stringify(pkg,null,2),'application/json')}
function backup(){downloadText('resumepilot_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'ResumePilotBackup',version:1,exportedAt:stamp(),data:db},null,2),'application/json');toast('Backup downloaded.')}
function restoreBackup(){const f=document.getElementById('backupFile').files[0];if(!f){toast('Choose a backup JSON file first.');return}const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);const incoming=parsed.data||parsed;if(!Array.isArray(incoming.applications)||!Array.isArray(incoming.resumes)||!Array.isArray(incoming.letters)||!Array.isArray(incoming.jobs))throw new Error('The file does not look like a ResumePilot backup.');['applications','resumes','letters','jobs'].forEach(k=>{const existing=new Set(db[k].map(x=>x.id));incoming[k].forEach(x=>{if(!existing.has(x.id)){db[k].push(x)}else{const copy=JSON.parse(JSON.stringify(x));copy.id=uid();db[k].push(copy)}})});persist();render();toast('Backup imported and merged. Duplicate IDs were copied as new records.')}catch(e){toast('Import failed: '+e.message)}};reader.readAsText(f)}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(b){setView(b.dataset.view)}});document.getElementById('quickNew').onclick=()=>{activeId=null;setView('application')};document.getElementById('helpBtn').onclick=()=>showModal('ResumePilot quick guide',`<p><strong>1. Analyze:</strong> paste a job posting and build an outline of requirements and keywords.</p><p><strong>2. Evaluate fit:</strong> map each requirement to truthful evidence from the candidate's background.</p><p><strong>3–4. Tailor documents:</strong> edit the resume and cover letter. Use “Save as new version” to create a separate version; use the version selector to recall earlier versions.</p><p><strong>5. Prepare:</strong> check the final documents, save notes, and export the application package.</p><p>All data is local to this browser. Use Backup & Settings to export or restore JSON backups.</p>`,()=>{},'Got it');document.querySelector('[data-save]').textContent='Got it';
render();
})();
</script>
</body>
</html>
